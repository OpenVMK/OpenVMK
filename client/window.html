<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VMK window, built by its own engine</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 24px;
        background: #12141a;
        color: #e6e8ef;
        font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      #status { color: #8b93a7; margin: 0 0 16px; }
      #stage {
        display: block;
        background: #1c1f27;
        border: 1px solid #2c313d;
        border-radius: 6px;
        max-width: 100%;
      }
      #trace {
        margin-top: 16px;
        padding: 12px;
        background: #171a21;
        border: 1px solid #2c313d;
        border-radius: 6px;
        color: #9aa3b8;
        white-space: pre-wrap;
        max-height: 260px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>error.window — assembled by CWindow.buildVisual, not by this page</h1>
    <p id="status">booting VMK's framework…</p>
    <canvas id="stage" width="800" height="400"></canvas>
    <pre id="trace"></pre>
    <script type="module" src="/src/window-demo.ts"></script>
  </body>
</html>
