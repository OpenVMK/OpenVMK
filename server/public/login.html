<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Virtual Magic Kingdom</title>
    <style>
      :root {
        --ink: #eaf2ff;
        --muted: #9fb3d0;
        --panel: #12203a;
        --panel-edge: #24406e;
        --accent: #4ea3ff;
        --bad: #ff8f8f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: #0a1426;
        background-image: radial-gradient(120% 90% at 50% 0%, #1b3a6b 0%, #0a1426 60%, #060d1a 100%);
        color: var(--ink);
        font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(380px, 100%);
        background: var(--panel);
        border: 1px solid var(--panel-edge);
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: 0.2px; }
      .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
      label { display: block; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
      input[type="text"], input[type="password"] {
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--panel-edge);
        background: #0d1830;
        color: var(--ink);
        font-size: 15px;
      }
      input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      button {
        width: 100%;
        margin-top: 6px;
        padding: 11px 14px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #04101f;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      .note { margin: 18px 0 0; color: var(--muted); font-size: 12.5px; }
      .error {
        margin: 0 0 16px;
        padding: 9px 12px;
        border-radius: 8px;
        background: rgba(255, 90, 90, 0.12);
        border: 1px solid rgba(255, 90, 90, 0.35);
        color: var(--bad);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <form class="card" method="POST" action="/auth">
      <h1>Virtual Magic Kingdom</h1>
      <p class="sub">Private server</p>

      <!--ERROR-->
      <!--NEXT-->

      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus
               maxlength="32" spellcheck="false">
      </label>

      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required
               maxlength="128">
      </label>

      <button type="submit">Enter</button>

      <p class="note">
        No account? Just pick a username and password — it will be created for you.
      </p>
    </form>
  </body>
</html>
