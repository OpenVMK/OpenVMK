<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>VMK Housekeeping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/hk/static/hk.css">
  </head>
  <body>
    <div class="login-page">
      <div class="login-box">
        <h1>VMK Housekeeping</h1>
        <form method="post" action="/hk/login" autocomplete="on">
          <!--ERROR-->
          <div>
            <label for="u">Username</label>
            <input type="text" id="u" name="username" autocomplete="username" required autofocus>
          </div>
          <div>
            <label for="p">Password</label>
            <input type="password" id="p" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary" type="submit">Log In</button>
          <p class="muted small" style="margin:0">Staff only. Every action here is logged.</p>
        </form>
      </div>
    </div>
  </body>
</html>
